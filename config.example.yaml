# The inspector reads this full configuration without downloads or agent calls.
# Replace the dataset and, if supplied, agent-model placeholders before a run.
dataset: YOUR_ORG/YOUR_DATASET
gpus: all

tasks:
  models: [Qwen3.6-35B-A3B]
  workloads: [S-1]
  types: [SOTA]

# Optional for foundation inspection, required for eval.run; coding adapter.
agent:
  name: codex  # Harbor built-in name or importable module.path:ClassName.
  # Optional: omit for an adapter default or a harness that manages its own models.
  model: YOUR_AGENT_MODEL
  kwargs: {}
  auth: login
  env: []
  budget: 2h

search:
  mode: combined
  # Reference search also uses Harbor's built-in/custom adapter format.
  agent:
    name: claude-code
    # Optional; the selected adapter owns its model/default requirements.
    model: YOUR_SEARCH_MODEL
    kwargs: {}
    auth: login
    env: []
    budget: 2h

evaluation:
  install_timeout: 4h
  health_timeout: 1h
  # Verification uses Rewardkit's agent judge: claude-code, codex or fx.
  agent:
    name: claude-code
    # Optional; omitted/null uses the selected reviewer's default model.
    model: null
    auth: login
    # Variable names only; values come from the host environment, not this YAML.
    # Empty env: login uses CLAUDE_CODE_OAUTH_TOKEN (Claude), CODEX_AUTH_JSON
    # (Codex) or VERCEL_OIDC_TOKEN (Fx); api_key uses the provider's API key.
    # A host CLI login alone does not supply verifier credentials.
    # Codex may explicitly forward [CODEX_AUTH_JSON, REWARDKIT_FORCE_SUBSCRIPTION].
    env: []
    budget: 30m
    # Native Rewardkit AgentJudge options: version and mcp_servers.
    # Workspace, batching and isolation are controlled by the evaluator.
    kwargs: {}

out: runs
