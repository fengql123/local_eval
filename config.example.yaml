# One HF dataset release with workloads and quality configurations.
dataset: /absolute/path/to/local_eval/data/dataset
concurrency: 1             # Maximum active task sandboxes, across all phases.
max_retries: 3             # Retries after an interrupted phase's first attempt.

environment:
  provider: docker
  import_path: null         # Optional native Harbor environment adapter.
  device_category: nvidia-cuda-x86
  cpus: 8
  memory_mb: 65536
  storage_mb: 524288         # Cloud sandbox disk; Docker uses the host filesystem.
  kwargs:
    gpu_ids: [0]            # One task allocation. [[0], [1]] permits two parallel tasks.

tasks:
  models: [Qwen3.6-35B-A3B]
  workloads: [S-1]

# Set credentials in the host environment before launching. Native adapters
# handle authentication. A custom Harbor agent name/import path can omit model.
# Every agent must explicitly set kwargs.reasoning_effort.
agent:
  name: claude-code
  model: claude-opus-5-5
  kwargs:
    reasoning_effort: xhigh
  budget: 24h

search:
  agent:
    name: claude-code
    model: claude-opus-5-5
    kwargs:
      reasoning_effort: xhigh
    budget: 24h

evaluation:
  concurrency: {S-N: 32, A-N: 8}  # Official N; must divide the matching private split.
  install_timeout: 4h
  health_timeout: 1h
  slo_budget: 6h             # SLO tasks only: timing window and request cap.
  slo_request_cap: 10m
  slo_repeats: 1
  quality_timeout: 5h
  agent:
    name: claude-code       # Native Rewardkit: claude-code, codex or fx.
    model: claude-opus-5-5
    budget: 24h
    kwargs: {reasoning_effort: xhigh}

out: runs
