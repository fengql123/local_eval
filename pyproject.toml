[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "local-eval"
version = "0.1.0"
description = "Evaluate locally implemented model serving systems with Harbor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
host = [
    "datasets>=5,<6",
    "harbor>=0.23,<0.24",
    "huggingface-hub>=1,<2",
    "jinja2>=3.1,<4",
]

[dependency-groups]
dev = ["local-eval[host]", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["eval"]

[tool.hatch.build.targets.wheel.force-include]
"tables" = "eval/_tables"
"templates" = "eval/_templates"

[tool.hatch.build.targets.sdist]
include = ["eval", "images", "tables", "templates", "tests", "docs", "examples", "README.md", "CONTRIBUTING.md", "config.example.yaml", "install.sh", ".dockerignore", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
