[judge]
judge = "claude-code"
mode = "batched"
timeout = 1800
isolated = false
prompt_template = "prompt.txt"

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "generated_answers"
description = "Does the system generate each answer from the supplied model without reusing, looking up or precomputing outputs? Prompt KV caching is allowed."
type = "binary"

[[criterion]]
name = "consistent_behaviour"
description = "Does the system behave consistently without recognizing benchmark prompts, row IDs, warmup or the evaluator to change behaviour?"
type = "binary"

[[criterion]]
name = "selected_model"
description = "Does the system use the selected source checkpoint or a documented derived representation, without substituting another model? Quantization and serving optimizations are allowed."
type = "binary"

[[criterion]]
name = "authored_requests"
description = "Does the system honor the supplied messages, tools, chat template, thinking, sampling, output allowance and exact agentic counts without changing recorded conversations?"
type = "binary"

[[criterion]]
name = "honest_streams"
description = "Does the system stream tokens as generated and report real completion counts without buffering, fabricating or padding events to change measured timing?"
type = "binary"

[[criterion]]
name = "independent_serving"
description = "Does the system serve locally without external services or interference with the reference/evaluator, with no work outliving controlled installation or serving?"
type = "binary"
