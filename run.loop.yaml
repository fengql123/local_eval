# Phase 11's test: the two-agent graph loop (local_harness's lh_agent.loop:GraphLoop) as the coding agent, one task:
# Qwen3.8-Flash-Next on S-1, a spot RTX 5090 on an AMD EPYC Genoa host. Launch with PYTHONPATH=~/local_harness.
dataset: /home/qilongf/local_eval/data/dataset
concurrency: 1
max_retries: 10            # spot sandboxes are reclaimed; each retry resumes the phase

environment:
  provider: daytona
  device_category: nvidia-cuda-x86
  cpus: 16
  memory_mb: 131072
  storage_mb: 524288
  kwargs:
    gpus: 1
    gpu_types: [RTX-5090]
    spot: true             # spot only
    auto_stop_interval_mins: 0
    auto_delete_interval_mins: 0
    cpu_prefixes: [AMD EPYC 9124, AMD EPYC 9174F, AMD EPYC 9184X, AMD EPYC 9224, AMD EPYC 9254, AMD EPYC 9274F, AMD EPYC 9334, AMD EPYC 9354, AMD EPYC 9354P, AMD EPYC 9374F, AMD EPYC 9384X, AMD EPYC 9454, AMD EPYC 9454P, AMD EPYC 9474F, AMD EPYC 9534, AMD EPYC 9554, AMD EPYC 9554P, AMD EPYC 9634, AMD EPYC 9654, AMD EPYC 9654P, AMD EPYC 9684X]   # any Genoa

tasks:
  models: [Qwen3.8-Flash-Next]
  workloads: [S-1]

agent:
  name: lh_agent.loop:GraphLoop
  kwargs:
    reasoning_effort: xhigh
    optimizer: {harness: claude-code, model: claude-opus-5-5, effort: xhigh, auth: login}
    builder: {harness: claude-code, model: claude-opus-5-5, effort: xhigh, auth: login}
    budget: 23h            # the loop's own, across resumed attempts; the last hour is the agent's margin
  budget: 24h

search:
  agent:
    name: claude-code
    model: claude-opus-5-5
    kwargs: {reasoning_effort: xhigh}
    budget: 24h

evaluation:
  agent:
    name: claude-code
    model: claude-opus-5-5
    kwargs: {reasoning_effort: xhigh}
    budget: 2h

out: runs
